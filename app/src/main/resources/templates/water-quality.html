<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/_layout :: layout(~{::body})}">
  <body>
    <section class="mb-6">
      <h1 class="text-2xl font-semibold">Water Quality - Turbidity</h1>
      <p class="text-gray-600" th:text="${riverName} + ' monitoring'">Wahumkhrah River monitoring</p>
    </section>

    <section class="rw-card p-4" style="min-height: 360px;">
      <div class="flex items-center justify-between mb-2">
        <div class="font-medium">Live Data</div>
        <span class="px-2 py-0.5 rounded-full bg-green-100 text-green-700 text-xs">Live Data</span>
      </div>
      <div class="chart-box">
    <canvas id="chartTurbidity"></canvas>
  </div>
    </section>

    <section class="rw-card p-4 mt-6">
      <div class="font-medium mb-3">Model Performance Metrics</div>
      <div class="space-y-3">
        <div>
          <div class="flex justify-between text-sm mb-1"><span>Precision</span><span>89.4%</span></div>
          <div class="bar"><div style="width: 89.4%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span>Recall</span><span>85.9%</span></div>
          <div class="bar"><div style="width: 85.9%"></div></div>
        </div>
        <div>
          <div class="flex justify-between text-sm mb-1"><span>mAP@0.5</span><span>85.9%</span></div>
          <div class="bar"><div style="width: 85.9%"></div></div>
        </div>
      </div>
    </section>
  </body>
</html>
